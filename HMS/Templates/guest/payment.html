{% extends '../index.html' %}
{% block context %}

<div class="container py-5 page-container">
    <div class="row justify-content-center">
        <!-- Payment Form -->
        <div class="col-md-7 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4">
                    <h3 class="mb-0">Payment Details</h3>
                    <p class="text-muted mb-0">Secure checkout — your data is protected</p>
                </div>
                <div class="card-body">
                    <form action="{% url 'verify' %}" method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="cardNumber" class="font-weight-bold">Card Number</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="cardNumber" placeholder="Valid Card Number" min="0" max="9999999999999999" required autofocus>
                                <div class="input-group-append">
                                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-7">
                                <div class="form-group">
                                    <label for="expityMonth" class="font-weight-bold">Expiry Date</label>
                                    <div class="form-row">
                                        <div class="col-6 pl-0">
                                            <input type="number" class="form-control" id="expityMonth" min="0" max="12" placeholder="MM" required>
                                        </div>
                                        <div class="col-6 pl-0">
                                            <input type="number" class="form-control" id="expityYear" placeholder="YY" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-5">
                                <div class="form-group">
                                    <label for="cvCode" class="font-weight-bold">CV Code</label>
                                    <input type="password" class="form-control" id="cvCode" placeholder="CV" required>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" value="{{ code }}" name="tempCode">
                        <button type="submit" class="btn btn-success btn-lg btn-block shadow-sm">Pay Now</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0 sticky-top" style="top: 80px;">
                <div class="card-header bg-white border-0 pt-4">
                    <h4 class="mb-0">Order Summary</h4>
                </div>
                <div class="card-body">
                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item d-flex justify-content-between px-0 bg-transparent">
                            <span>Booking Reference</span><span class="font-weight-bold">{{ code }}</span>
                        </li>
                    </ul>
                    <hr>
                    <p class="text-muted small">Your booking is confirmed. You will receive an email confirmation once the payment is processed.</p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
