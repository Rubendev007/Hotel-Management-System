<div class="container py-4 flex-grow-1">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-light border-0 d-flex align-items-center justify-content-between">
      <div><h2 class="h5 mb-0 fw-bold">Room Services</h2><span class="text-muted small">Last 1 month</span></div>
    </div>
    <div class="card-body">
      <form action="" method="POST" class="row g-2 align-items-end">
        {% csrf_token %}
        <div class="col-md-2"><label class="form-label small">Guest</label><input type="text" name="guest" class="form-control" placeholder="Guest"></div>
        <div class="col-md-2"><label class="form-label small">Room</label><input type="text" name="room" class="form-control" placeholder="Room"></div>
        <div class="col-md-2"><label class="form-label small">Type</label><input type="text" name="type" class="form-control" placeholder="Type"></div>
        <div class="col-md-2"><label class="form-label small">Created</label><input type="date" name="date" class="form-control"></div>
        <div class="col-md-2"><label class="form-label small">Price</label><input type="text" name="price" class="form-control" placeholder="Price"></div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Filter</button></div>
      </form>
    </div>
  </div>
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Guest</th><th>Room</th><th>Type</th><th>Created</th><th>Price</th><th>Delete</th></tr></thead>
          <tbody>
            {% for rs in room_services %}
            <tr>
              <td><a href="{% url 'guest-profile' rs.curBooking.guest.user.id %}" class="text-decoration-none">{{ rs.curBooking.guest.user.first_name }}</a></td>
              <td><a href="{% url 'room-profile' rs.room.number %}" class="text-decoration-none">{{ rs.room.number }}</a></td>
              <td><span class="badge bg-secondary">{{ rs.servicesType }}</span></td>
              <td>{{ rs.createdDate }}</td>
              <td>{{ rs.price }}</td>
              <td><a href="" class="btn btn-sm btn-outline-danger">Delete</a></td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center py-4 text-muted">No services.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
