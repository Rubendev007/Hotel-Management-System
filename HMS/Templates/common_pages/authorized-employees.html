<div class="container py-4 flex-grow-1">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h4 mb-0 fw-bold">Employees</h2>
      </div>
      <form action="" method="POST" class="row g-2 align-items-end">
        {% csrf_token %}
        <div class="col-md-2"><label class="form-label small">ID</label><input type="number" name="id" value="{{id}}" class="form-control"></div>
        <div class="col-md-2"><label class="form-label small">Name</label><input type="text" name="name" value="{{name}}" class="form-control"></div>
        <div class="col-md-2"><label class="form-label small">Email</label><input type="text" name="email" value="{{email}}" class="form-control"></div>
        <div class="col-md-2"><label class="form-label small">Phone</label><input type="text" name="number" value="{{number}}" class="form-control"></div>
        <div class="col-md-2"><label class="form-label small">Role</label><input type="text" name="filterRole" value="{{filterRole}}" class="form-control"></div>
        <div class="col-md-2"><button type="submit" name="filter" class="btn btn-primary w-100">Filter</button></div>
      </form>
    </div>
  </div>
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody>
            {% for employee in employees %}
            <tr>
              <td>{{employee.user.id}}</td>
              <td>{{employee.user.first_name}} {{employee.user.last_name}}</td>
              <td>{{employee.user.email}}</td>
              <td>{{employee.phoneNumber}}</td>
              <td><span class="badge bg-secondary">{{employee.user.groups.first}}</span></td>
              <td><a href="{% url 'employee-profile' employee.user.id %}" class="btn btn-sm btn-outline-primary">Detail</a></td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center py-4 text-muted">No results.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
