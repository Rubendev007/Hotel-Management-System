{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewmates | Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,400&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { gold: '#c5a265', ink: '#0f172a', mist: '#f8f6f2' },
  fontFamily: { display: ['Bodoni Moda', 'serif'], brand: ['Cinzel', 'serif'], body: ['Inter', 'sans-serif'] }
}}}
</script>
<style>
body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
.glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05); }
.input-field { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); transition: all .3s ease; }
.input-field:focus { background: rgba(255,255,255,0.1); border-color: rgba(197,162,101,0.6); box-shadow: 0 0 0 3px rgba(197,162,101,0.15); outline: none; }
</style>
</head>
<body class="bg-ink min-h-screen flex items-center justify-center relative overflow-hidden">

<!-- Background lobby -->
<img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop" alt="Hotel lobby" class="absolute inset-0 w-full h-full object-cover opacity-40" fetchpriority="high">
<div class="absolute inset-0" style="background: linear-gradient(160deg, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0.55) 60%, rgba(15,23,42,0.9) 100%);"></div>

<!-- Main card -->
<div class="relative z-10 w-full max-w-md mx-6 p-10 md:p-12 glass-card rounded-3xl">
  <div class="text-center mb-10">
    <a href="#" class="font-brand text-3xl md:text-4xl text-white tracking-[0.25em] drop-shadow-2xl hover:opacity-90 transition">CREWMATES</a>
    <h1 class="font-display text-3xl md:text-4xl text-white/90 mt-3 leading-[1.05] font-medium" style="letter-spacing:-0.02em;">Welcome Back</h1>
    <p class="font-body text-white/50 mt-2 tracking-wide text-xs uppercase">Please sign in to continue</p>
  </div>

  <form method="POST" action="" autocomplete="off" class="space-y-6">
    {% csrf_token %}
    <div>
      <label for="username" class="block text-xs font-bold text-white/50 uppercase tracking-[0.15em] mb-2">Username</label>
      <input id="username" type="text" name="username" placeholder="Enter username" class="input-field w-full px-5 py-3.5 rounded-xl text-white placeholder-white/30 font-body text-base" required>
    </div>
    <div>
      <label for="password" class="block text-xs font-bold text-white/50 uppercase tracking-[0.15em] mb-2">Password</label>
      <input id="password" type="password" name="password" placeholder="Enter password" class="input-field w-full px-5 py-3.5 rounded-xl text-white placeholder-white/30 font-body text-base" required>
    </div>
    <div class="flex justify-center">
      <button type="submit" class="px-10 py-3 rounded-full bg-gradient-to-r from-gold/90 to-amber-700 text-ink font-brand font-bold text-sm tracking-[0.15em] shadow-2xl hover:shadow-gold/30 hover:scale-[1.02] transition-all duration-300">SIGN IN</button>
    </div>
  </form>

  {% if messages %}
    <div class="mt-6 space-y-2">
      {% for message in messages %}
        <p class="text-sm text-white/80 bg-white/10 rounded-lg px-4 py-2.5 border border-white/10">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <div class="mt-8 pt-6 border-t border-white/10 flex items-center justify-between text-sm font-body">
    <span class="text-white/40">New guest?</span>
    <a href="{% url 'register' %}" class="text-gold font-semibold hover:text-white transition">Create account</a>
  </div>
</div>

<!-- Footer brand -->
<div class="absolute bottom-6 left-0 right-0 text-center z-10">
  <p class="font-brand text-white/30 text-xs tracking-[0.3em] uppercase">Crewmates Hotel Management</p>
</div>

</body>
</html>
